name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

env:
  APP_NAME: 'TakeIt'
  # Tag being released: the pushed tag, or the one typed in when run by hand
  # (github.ref_name is the branch name in that case).
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # -----------------------------------------------------------
  # ANDROID (.apk)
  # -----------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: takeit
        run: flutter pub get

      - name: Generate code
        working-directory: takeit
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Set up release signing
        working-directory: takeit/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=APK signed with a debug key::ANDROID_KEYSTORE_BASE64 is not set. This APK is signed with a throwaway key and cannot update existing installs."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Version comes from the tag; the build number is derived from it
      # (1.2.3 -> 10203) so Android's versionCode always increases.
      - name: Build APK
        working-directory: takeit
        run: |
          VERSION="${RELEASE_TAG#v}"
          BUILD_NUMBER=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"

      - name: Rename APK
        working-directory: takeit
        run: |
          VERSION="${RELEASE_TAG#v}"
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/TakeIt-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: takeit/build/app/outputs/flutter-apk/TakeIt-*.apk

  # -----------------------------------------------------------
  # WINDOWS (.exe + Inno Setup installer)
  # -----------------------------------------------------------
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: takeit
        run: flutter pub get

      - name: Generate code
        working-directory: takeit
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        working-directory: takeit
        shell: pwsh
        run: |
          $version = "$env:RELEASE_TAG" -replace '^v',''
          $p = ($version -replace '[-+].*$','').Split('.')
          $build = [int]$p[0] * 10000 + [int]$p[1] * 100 + [int]$p[2]
          flutter build windows --release --build-name=$version --build-number=$build

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        working-directory: takeit
        shell: pwsh
        run: |
          $version = "$env:RELEASE_TAG" -replace '^v',''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer.iss

      - name: Rename installer
        working-directory: takeit
        shell: pwsh
        run: |
          $version = "$env:RELEASE_TAG" -replace '^v',''
          Rename-Item "build\installer\TakeIt_Setup.exe" "TakeIt-Setup-$version.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: takeit/build/installer/TakeIt-Setup-*.exe

  # -----------------------------------------------------------
  # MACOS (.dmg)
  # -----------------------------------------------------------
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: takeit
        run: flutter pub get

      - name: Generate code
        working-directory: takeit
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS release
        working-directory: takeit
        run: |
          VERSION="${RELEASE_TAG#v}"
          BUILD_NUMBER=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          flutter build macos --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"

      - name: Package as DMG
        working-directory: takeit
        run: |
          VERSION="${RELEASE_TAG#v}"
          APP_PATH="build/macos/Build/Products/Release/takeit.app"
          DMG_NAME="TakeIt-${VERSION}.dmg"
          brew install create-dmg
          create-dmg \
            --volname "TakeIt" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 200 \
            --icon "takeit.app" 200 200 \
            "$DMG_NAME" \
            "$APP_PATH" || true
          # Fallback if create-dmg fails (unsigned apps sometimes trip it)
          if [ ! -f "$DMG_NAME" ]; then
            hdiutil create -volname "TakeIt" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: takeit/TakeIt-*.dmg

  # -----------------------------------------------------------
  # LINUX (tar.gz — AppImage can be added later)
  # -----------------------------------------------------------
  build-linux:
    name: Build Linux Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev libnotify-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: takeit
        run: flutter pub get

      - name: Generate code
        working-directory: takeit
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux release
        working-directory: takeit
        run: |
          VERSION="${RELEASE_TAG#v}"
          BUILD_NUMBER=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          flutter build linux --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"

      - name: Package as tar.gz
        working-directory: takeit
        run: |
          VERSION="${RELEASE_TAG#v}"
          cd build/linux/x64/release/bundle
          tar -czf "../../../../../TakeIt-${VERSION}-linux-x64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: takeit/TakeIt-*-linux-x64.tar.gz

  # -----------------------------------------------------------
  # RELEASE — collect all artifacts and publish
  # -----------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The app downloads <asset>.sha256 next to the installer and refuses
      # an update whose SHA-256 does not match.
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          for f in TakeIt-*; do
            sha256sum "$f" > "$f.sha256"
          done
          cat ./*.sha256

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TakeIt ${{ env.RELEASE_TAG }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/TakeIt-*.apk
            artifacts/TakeIt-Setup-*.exe
            artifacts/TakeIt-*.dmg
            artifacts/TakeIt-*-linux-x64.tar.gz
            artifacts/TakeIt-*.sha256
