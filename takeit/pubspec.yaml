name: takeit
description: "Local network file sharing & group chat"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  go_router: ^13.2.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  dio: ^5.4.3
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  uuid: ^4.3.3
  fpdart: ^1.1.0
  open_filex: ^4.7.0
  flutter_foreground_task: ^9.2.2
  flutter_local_notifications: ^18.0.1
  window_manager: ^0.4.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  desktop_drop: ^0.7.0
  local_notifier: ^0.1.6
  ffi: ^2.2.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: "assets/logo_mark.png"
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/logo_mark.png"
  windows:
    generate: true
    image_path: "assets/logo_mark.png"
    icon_size: 48

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_mark.png
    - assets/takeit_logo_emblem.svg
  fonts:
    # Full variable fonts (include Latin Extended-A → Turkish ğ ş ı İ ç ö ü).
    # Weights are selected via the wght axis from TextStyle.fontWeight.
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
